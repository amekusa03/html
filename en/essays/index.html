    const CATEGORY_ORDER = ["Development", "Android", "Linux", "Python", "ESP32", "Car", "Music", "Daily Life", "Others"];
    const CATEGORY_ICONS = { "Development": "🛠️", "Android": "🤖", "Linux": "🐧", "Python": "🐍", "ESP32": "⚡", "Car": "🚗", "Music": "🎧", "Daily Life": "☕", "Others": "🌿" };
    const allCategories = ["all", ...CATEGORY_ORDER.filter(cat => ESSAYS.some(e => e.categories.includes(cat)))];

    const mainEl = document.getElementById('archive-main');
    let currentCat = "all";

    function renderArchiveList() {
      document.title = "Notes Archive | Raingrass Garden";

      const sorted = [...ESSAYS].sort((a, b) => b.slug.localeCompare(a.slug));
      const filtered = currentCat === "all" ? sorted : sorted.filter(e => e.categories.includes(currentCat));

      let html = `
        <div class="archive-header">
          <h2>Notes Archive</h2>
          <p class="archive-count">All ${ESSAYS.length} cases</p>
        </div>
        <div class="category-filter" id="cat-filter">
      `;

      allCategories.forEach(cat => {
        const isActive = cat === currentCat ? ' active' : '';
        const icon = CATEGORY_ICONS[cat] ? CATEGORY_ICONS[cat] + ' ' : '';
        html += `<button class="cat-btn${isActive}" data-cat="${cat}">${icon}${cat}</button>`;
      });

      html += `</div>`;

      if (filtered.length === 0) {
        html += `<ul class="essay-list"><li class="empty-msg">There are no matching articles. </li></ul>`;
      } else {
        let currentYear = null;

        filtered.forEach(essay => {
          const year = essay.date ? essay.date.substring(0, 4) : essay.slug.substring(0, 4);

          if (year !== currentYear) {
            if (currentYear !== null) {
              html += `</ul>`;
            }
            currentYear = year;
            const countInYear = filtered.filter(e => (e.date ? e.date.substring(0, 4) : e.slug.substring(0, 4)) === year).length;
            html += `
              <h3 class="year-heading">
                <span>${year} year</span>
                <span class="year-count">${countInYear} cases</span>
              </h3>
              <ul class="essay-list">
            `;
          }

          const cats = essay.categories && essay.categories.length ? essay.categories : ['Others'];
          html += `
            <li class="essay-item" data-cat="${cats.join(' ')}">
              <span class="essay-date">
                ${cats.map(c => `<span class="essay-category-badge">${CATEGORY_ICONS[c] || ''} ${c}</span>`).join('')}
                ${essay.date}
              </span>
              <a href="#essay=${essay.slug}" class="essay-title">${essay.title}</a>
            </li>
          `;
        });
        html += `</ul>`;
      }

      mainEl.innerHTML = html;

      document.getElementById('cat-filter').addEventListener('click', e => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;
        currentCat = btn.dataset.cat;
        renderArchiveList();
      });

      window.scrollTo(0, 0);
    }

    async function loadEssay(slug) {
      mainEl.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const dirPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        const response = await fetch(`${dirPath}/${slug}.md`);
        if (!response.ok) throw new Error('File not found');
        const markdownText = await response.text();
        const parsedHtml = marked.parse(markdownText);

        const essay = ESSAYS.find(e => e.slug === slug);
        if (essay) document.title = `${essay.title} | Rainweed garden`;

        mainEl.innerHTML = `
          <section class="essay-detail-section">
            <a href="#" class="back-btn" id="back-to-list">← Return to list</a>
            <div class="essay-content">${parsedHtml}</div>
          </section>
        `;

        mainEl.querySelectorAll('img').forEach(img => {
          const src = img.getAttribute('src');
          if (src && src.startsWith('essays/')) {
            img.setAttribute('src', src.replace(/^essays\//, `${dirPath}/`));
          }
        });

        document.getElementById('back-to-list').addEventListener('click', e => {
          e.preventDefault();
          history.replaceState(null, '', location.pathname);
          renderArchiveList();
        });

      } catch (error) {
        console.error(error);
        mainEl.innerHTML = `
          <div style="text-align:center;padding:3rem 0;">
            <p style="font-size:1.2rem;margin-bottom:1.5rem;">No essays found. </p>
            <a href="#" class="back-btn" id="back-to-list" style="margin-bottom:0;">← Return to list</a>
          </div>
        `;
        document.getElementById('back-to-list').addEventListener('click', e => {
          e.preventDefault();
          history.replaceState(null, '', location.pathname);
          renderArchiveList();
        });
      }
      window.scrollTo(0, 0);
    }

    function router() {
      const hash = window.location.hash;
      if (hash.startsWith('#essay=')) {
        loadEssay(hash.replace('#essay=', ''));
      } else {
        renderArchiveList();
      }
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
