<!-- Lightbox -->
<div class="photo-lightbox" id="photoLightbox">
<button class="photo-lightbox-close" id="lightboxClose">✕</button>
<button class="photo-lightbox-prev" id="lightboxPrev">‹</button>
<img alt="" class="photo-lightbox-img" id="lightboxImg" src=""/>
<button class="photo-lightbox-next" id="lightboxNext">›</button>
</div>
<script>
        const lightbox = document.getElementById('photoLightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const items = Array.from(document.querySelectorAll('.photo-item img'));
        let current = 0;

        function openLightbox(index) {
            current = index;
            lightboxImg.src = items[current].src;
            lightboxImg.alt = items[current].alt;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }
        function prev() { openLightbox((current - 1 + items.length) % items.length); }
        function next() { openLightbox((current + 1) % items.length); }

        items.forEach((img, i) => img.parentElement.addEventListener('click', () => openLightbox(i)));
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', prev);
        document.getElementById('lightboxNext').addEventListener('click', next);
        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowRight') next();
        });
    </script>
